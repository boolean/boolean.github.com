<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ site.description }}">
    <meta name="author" content="{{ site.author }}">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ site.title }} — {{ site.tagline }}">
    <meta property="og:description" content="{{ site.description }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=VT323&display=swap" rel="stylesheet">

    <style>
      :root {
        --amber:        #ffb000;
        --amber-bright: #ffd166;
        --amber-dim:    #c4831a;
        --amber-faint:  #8a5c12;
        --bg:           #120c03;
        --bg-soft:      #1a1206;
        --line:         rgba(255, 176, 0, 0.18);
        --glow:         0 0 2px rgba(255, 176, 0, 0.45);
        --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      * { box-sizing: border-box; }

      html { scroll-behavior: smooth; }

      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(ellipse at 50% 0%, var(--bg-soft) 0%, var(--bg) 70%);
        color: var(--amber);
        font-family: var(--mono);
        font-size: 16px;
        line-height: 1.65;
        text-shadow: var(--glow);
        -webkit-font-smoothing: antialiased;
        letter-spacing: 0.01em;
      }

      /* CRT scanlines + subtle vignette + flicker, all decorative */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 9999;
        background: repeating-linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0) 0px,
          rgba(0, 0, 0, 0) 2px,
          rgba(0, 0, 0, 0.18) 3px,
          rgba(0, 0, 0, 0.18) 4px
        );
        mix-blend-mode: multiply;
      }
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 9998;
        background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%);
        animation: flicker 6s infinite steps(60);
      }
      @keyframes flicker {
        0%, 97%, 100% { opacity: 1; }
        98%           { opacity: 0.86; }
        99%           { opacity: 0.96; }
      }
      @media (prefers-reduced-motion: reduce) {
        body::after { animation: none; }
        .cursor { animation: none; }
      }

      .wrap {
        max-width: 820px;
        margin: 0 auto;
        padding: 2.5rem 1.25rem 4rem;
      }

      /* Top bar — looks like a window/title bar */
      .topbar {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        border: 1px solid var(--line);
        border-radius: 6px 6px 0 0;
        padding: 0.5rem 0.85rem;
        background: rgba(255, 176, 0, 0.04);
        font-size: 0.8rem;
        color: var(--amber-dim);
      }
      .topbar .dots { display: flex; gap: 0.4rem; }
      .topbar .dots span {
        width: 11px; height: 11px; border-radius: 50%;
        border: 1px solid var(--amber-faint);
        display: inline-block;
      }
      .topbar .title { margin-left: 0.4rem; }
      .topbar nav { margin-left: auto; display: flex; gap: 0.9rem; }
      .topbar nav a { color: var(--amber-dim); text-decoration: none; }
      .topbar nav a:hover { color: var(--amber-bright); }

      .screen {
        border: 1px solid var(--line);
        border-top: none;
        border-radius: 0 0 6px 6px;
        padding: 1.75rem 1.5rem 2rem;
        background: rgba(255, 176, 0, 0.015);
      }

      a { color: var(--amber-bright); text-decoration: none; border-bottom: 1px dotted var(--amber-faint); }
      a:hover { color: #fff3da; border-bottom-color: var(--amber-bright); }

      .prompt { color: var(--amber-dim); display: block; margin: 2.1rem 0 0.5rem; font-size: 0.92rem; }
      .prompt:first-child { margin-top: 0; }
      .prompt .user { color: var(--amber); }
      .prompt .path { color: var(--amber-faint); }
      .prompt .cmd  { color: var(--amber-bright); }

      h1 {
        font-family: 'VT323', var(--mono);
        font-weight: 400;
        font-size: clamp(2.6rem, 9vw, 4.6rem);
        line-height: 0.95;
        margin: 0.2rem 0 0.1rem;
        color: var(--amber-bright);
        letter-spacing: 0.02em;
        text-shadow: 0 0 8px rgba(255, 176, 0, 0.45);
      }
      .role { font-size: 1.05rem; color: var(--amber); margin: 0 0 0.2rem; }
      .meta { color: var(--amber-dim); font-size: 0.9rem; }

      p { margin: 0.3rem 0 0.6rem; }
      .out { color: var(--amber); }
      .dim { color: var(--amber-dim); }

      ul { list-style: none; margin: 0.2rem 0 0.6rem; padding: 0; }
      ul.bullets li { padding-left: 1.4rem; position: relative; margin: 0.35rem 0; }
      ul.bullets li::before { content: ">"; position: absolute; left: 0; color: var(--amber-faint); }

      /* Experience listing */
      .exp { margin: 0.3rem 0 0.4rem; }
      .exp .job {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 0.2rem 1rem;
        padding: 0.7rem 0;
        border-bottom: 1px dashed var(--line);
      }
      .exp .job:last-child { border-bottom: none; }
      .exp .co  { color: var(--amber-bright); font-weight: 500; }
      .exp .pos { color: var(--amber); }
      .exp .when { color: var(--amber-faint); font-size: 0.85rem; text-align: right; white-space: nowrap; }
      .exp .desc { grid-column: 1 / -1; color: var(--amber-dim); font-size: 0.9rem; margin-top: 0.15rem; }

      /* Skill tags */
      .tags { display: flex; flex-wrap: wrap; gap: 0.45rem; margin: 0.4rem 0 0.5rem; }
      .tags span {
        border: 1px solid var(--amber-faint);
        border-radius: 3px;
        padding: 0.15rem 0.55rem;
        font-size: 0.82rem;
        color: var(--amber);
      }

      .links { display: flex; flex-wrap: wrap; gap: 1.2rem; margin-top: 0.4rem; }

      .cv-btn {
        display: inline-block;
        margin-top: 0.8rem;
        border: 1px solid var(--amber);
        border-radius: 4px;
        padding: 0.5rem 1rem;
        color: var(--amber-bright);
        background: rgba(255, 176, 0, 0.06);
        font-weight: 500;
      }
      .cv-btn:hover { background: rgba(255, 176, 0, 0.16); color: #fff3da; }

      .cursor {
        display: inline-block;
        width: 0.6em; height: 1.05em;
        background: var(--amber-bright);
        margin-left: 0.15em;
        vertical-align: text-bottom;
        animation: blink 1.05s steps(1) infinite;
        box-shadow: 0 0 6px rgba(255, 176, 0, 0.6);
      }
      @keyframes blink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }

      footer {
        margin-top: 2.2rem;
        color: var(--amber-faint);
        font-size: 0.8rem;
        text-align: center;
      }

      @media (max-width: 560px) {
        .exp .job { grid-template-columns: 1fr; }
        .exp .when { text-align: left; }
        .topbar .title { display: none; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="topbar">
        <span class="dots"><span></span><span></span><span></span></span>
        <span class="title">— fernando@boolean: ~ —</span>
        <nav>
          <a href="#experience">experience</a>
          <a href="#contact">contact</a>
        </nav>
      </div>
      <main class="screen">
        {{ content }}
      </main>
      <footer>
        <span class="dim">$</span> built with jekyll · {{ site.title }} · boolean.buzz
      </footer>
    </div>
  </body>
</html>
